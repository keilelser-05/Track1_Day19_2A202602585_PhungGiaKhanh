(() => {
 'use strict';

 function draft(){return `<h2>Câu hỏi cho coach</h2><p class="muted small">Bản nháp chưa gửi. Hãy sửa để đúng chỗ bạn đang vướng.</p><label for="sourceSlide">Vị trí cần hỗ trợ</label><select id="sourceSlide">${[5,6,7].map(n=>`<option value="${n}" ${n===s.source?'selected':''}>Slide ${n} — ${slides[n].title}</option>`).join('')}</select><label for="draft">Nội dung yêu cầu</label><textarea id="draft">${esc(s.draft)}</textarea><label for="recipient">Người nhận</label><select id="recipient"><option ${s.recipient.startsWith('Lab')?'selected':''}>Lab coach — hỗ trợ khái niệm</option><option ${s.recipient.startsWith('TA')?'selected':''}>TA — hỗ trợ bài tập</option></select><label class="control"><input id="named" type="checkbox" ${s.named?'checked':''}>Kèm tên của tôi</label>${s.named?`<label for="name">Tên giả lập</label><input id="name" type="text" value="${esc(s.name)}">`:''}${s.enabled&&s.attachment?`<label class="control"><input id="share" type="checkbox" ${s.share?'checked':''}>Kèm tín hiệu đã tạo gợi ý</label><p class="quiet">${esc(labelSignal(s.attachment))}</p>`:''}<p class="quiet">Không tự đính kèm chat, ghi chú hoặc đáp án quiz.</p><div class="actions">${btn('Xem trước','preview','primary')}${btn('Không gửi, quay lại học','cancel')}</div>`;}
 function preview(){return `<h2>Kiểm tra trước khi gửi</h2><div class="preview"><dl><dt>Người nhận</dt><dd>${esc(s.recipient)}</dd><dt>Danh tính</dt><dd>${s.named?esc(s.name):'Không kèm tên'}</dd><dt>Vị trí</dt><dd>Slide ${s.source} — ${slides[s.source].title}</dd><dt>Nội dung</dt><dd>${esc(s.draft)}</dd><dt>Tín hiệu</dt><dd id="previewSignal">${s.share&&s.enabled&&s.attachment?esc(labelSignal(s.attachment)):'Không chia sẻ'}</dd></dl></div>${box('Chỉ mô phỏng gửi; không liên hệ coach thật. Không hứa thời gian phản hồi.')}<div class="actions">${btn('Xác nhận gửi','send','primary')}${btn('Sửa bản nháp','edit')}${btn('Không gửi','cancel')}</div>`;}
 function result(){if(!s.submitted)return `<h2>Tiếp tục theo cách của bạn</h2>${box(s.notice||'Bạn chọn quay lại học. Không gửi yêu cầu cho coach.','success')}<div class="actions">${btn('Quay lại bài học','back','primary')}${btn('Hỏi tiếp','tutor')}${btn('Viết câu hỏi cho coach','manual-draft')}</div>`;return `<h2>Yêu cầu đã gửi · mô phỏng</h2><p class="small muted">${esc(s.recipient)} · Slide ${s.source}</p>${box(esc(s.draft))}${s.coach?box('<strong>Coach · phản hồi mẫu</strong><p style="margin-top:8px">'+esc(coachReply)+'</p>'):box('Yêu cầu đang chờ trong mô phỏng. Bạn có thể tiếp tục học hoặc mở phản hồi mẫu.')}<div class="actions">${!s.coach?btn('Đọc phản hồi mẫu','response','primary')+btn('Sửa yêu cầu','edit')+btn('Thu hồi','withdraw'):btn('Hỏi thêm','manual-draft')}${btn('Tiếp tục bài học','back')}</div><p class="quiet">${s.coach?'Phản hồi đã được mở; không hứa xóa nội dung người nhận đã đọc.':'Có thể thu hồi trước khi mở phản hồi mẫu.'}</p>`;}
 function panel(){const content=s.mode==='draft'?draft():s.mode==='preview'?preview():s.mode==='result'?result():s.tab==='notes'?`<h2>Ghi chú của bạn</h2><label for="notes">Chỉ giữ trong phiên thử</label><textarea id="notes" placeholder="Ghi lại điều bạn muốn nhớ…">${esc(s.notes)}</textarea><p class="quiet">Ghi chú không được dùng để suy đoán hoặc gửi coach.</p>`:(s.submitted?box('Bạn có một yêu cầu coach trong phiên. '+btn('Xem yêu cầu','request')):'')+prompt()+chat();return `<section class="card support-panel"><div class="card-title"><h2>✦ Trợ giảng AI</h2><div class="actions" style="margin:0">${s.enabled?btn('Tắt gợi ý','disable'):''}${btn(s.panel?'Thu gọn':'Mở hỗ trợ','panel')}</div></div>${s.panel?`<div class="tabs" role="group" aria-label="Khu vực hỗ trợ">${btn('Tutor','tutor',s.tab==='tutor'?'subtle':'')}${btn('Ghi chú','notes',s.tab==='notes'?'subtle':'')}${btn('Hỏi coach','manual-draft',s.mode==='draft'?'subtle':'')}</div><div class="card-body">${content}<div class="notice" role="status" aria-live="polite">${s.mode==='result'?'':esc(s.notice)}</div></div>`:`<div class="card-body"><p class="quiet">${s.prompt?'Có một gợi ý đang chờ. Bạn quyết định khi nào mở.':'Bạn có thể tiếp tục đọc tài liệu.'}</p></div>`}</section>`;}
 function render(){app.innerHTML=window.VL_UI.frame({option:'c',stage:s.stage,slide:s.slide,lesson:lesson(),support:panel(),extra:consent(),dock:s.panel,floating:!s.panel?prompt():'',notice:esc(s.notice),hasSuggestion:!!s.prompt});}
 function cancelPending(){s.requestId++;if(pending)clearTimeout(pending);pending=null;s.busy=false;}

 function openDraft(manual=false){cancelPending();s.source=manual?s.slide:(s.prompt?.slide||s.chat.filter(m=>m.role==='user').at(-1)?.slide||s.slide);s.attachment=s.prompt?{...s.prompt}:s.attachment;s.prompt=null;s.stage=1;s.mode='draft';s.tab='tutor';s.panel=true;s.share=false;if(!s.draft){const q=s.chat.filter(m=>m.role==='user').at(-1)?.text;s.draft=q?`Mình muốn hỏi về slide ${s.source}: ${q}\nMình đã xem gợi ý nhưng vẫn cần làm rõ.`:`Mình đang đọc slide ${s.source}: ${slides[s.source].title}. Chỗ mình muốn hỏi: `;}render();}
 function canned(q,n){const t=q.toLowerCase();if(/top.?k|chọn k|đăng nhập|học phí|python|code|điểm thi/.test(t))return {text:'Tài liệu mẫu 5–7 chưa đủ căn cứ trả lời câu này. Bạn có thể nói rõ phần liên quan đến RAG hoặc nhờ coach. Mình không tự đoán.',sources:[]};if(/ví dụ|minh họa/.test(t))return {text:'Ví dụ bạn hỏi chính sách đổi trả: bước truy xuất tìm đoạn chính sách liên quan; bước sinh dùng đoạn đó để viết câu trả lời. Nếu đoạn tìm được không chứa điều bạn hỏi, lời giải vẫn có thể sai. Theo bạn, đâu là bước tìm tài liệu?',sources:[6,7]};if(/sai|ảo giác|căn cứ|hallucin|tin|đúng/.test(t))return {text:'Theo slide 5, câu trả lời trôi chảy chưa chắc đúng. RAG bổ sung tài liệu để đối chiếu, nhưng không bảo đảm mô hình luôn đúng. Bạn hãy kiểm tra đoạn nguồn có thực sự hỗ trợ kết luận không.',sources:[5,6]};if(/bước|quy trình|thứ tự/.test(t))return {text:'Bốn bước: nhận câu hỏi → tìm đoạn tài liệu → đưa câu hỏi và đoạn đó vào mô hình → sinh câu trả lời. Bước 2 là truy xuất, bước 4 là sinh. Bạn thử xác định bước đang vướng nhé.',sources:[7]};if(/rag|truy xuất|sinh|retrieval|tài liệu/.test(t))return {text:explanation+' Theo bạn, bước nào tìm tài liệu trước khi trả lời?',sources:[6,7]};if(/chưa rõ|chưa hiểu|giải thích|giúp/.test(t))return {text:`Bạn muốn làm rõ ${n===5?'cách kiểm tra căn cứ':n===7?'thứ tự các bước':'truy xuất hay sinh câu trả lời'}? Nói rõ một chỗ để mình gợi ý tiếp.`,sources:[n]};return {text:'Mình chưa xác định được chỗ bạn muốn hỏi. Bạn có thể nêu một thuật ngữ hoặc bước trong slide 5–7; nếu câu hỏi nằm ngoài tài liệu, hãy chuyển coach.',sources:[]};}
 function ask(q,n=s.slide){if(s.busy)return;q=q.trim();if(!q){s.notice='Hãy viết câu hỏi trước khi gửi.';render();return;}s.query='';s.stage=1;s.mode='learn';s.tab='tutor';s.panel=true;s.prompt=null;s.chat.push({role:'user',text:q,slide:n});s.busy=true;s.notice='';const id=++s.requestId;render();pending=setTimeout(()=>{if(id!==s.requestId)return;s.chat.push({role:'ai',slide:n,...canned(q,n)});s.busy=false;pending=null;render();},600);}
 document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();ask(s.query);}});

 document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;s.notice='';
